h1,h2,p{margin:0}
.bars{display:flex;flex-direction:column;align-items:flex-start;gap:.1em;font-weight:800;line-height:1;letter-spacing:-.01em;color:var(--ink)}
.bars span{display:block;background:var(--purple);padding:.15em .25em 0 .19em}
.bars span b{display:block;font-weight:inherit;transform:skewX(-11deg)}
h1.bars{font-size:1em}
/* bottom row: Vol II cover + release date, then the streaming links */
.release{display:flex;align-items:flex-end;gap:max(16px,.8em);font-size:max(18px,min(4vw,3.3vh))}
.cover{display:block;flex:none;width:5.6em;height:auto;aspect-ratio:1;box-shadow:0 .25em 1em rgba(30,10,70,.3)}
.release-info{display:flex;flex-direction:column;align-items:flex-start;gap:.7em;min-width:0}
.release .bars{font-size:1.25em}
.listen{display:flex;flex-wrap:wrap;gap:.45em .55em;font-weight:800;letter-spacing:.02em}
.listen a{display:block;background:var(--purple);color:var(--ink);text-decoration:none;line-height:1;padding:.32em .45em .14em .4em}
.listen a b{display:block;font-weight:inherit;transform:skewX(-11deg)}
.listen a:hover{background:var(--purple-hi)}
.listen a:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
/* .top's font-size is the title size, so the player can be sized in em to match the title block */
.top{display:flex;flex-direction:column;gap:max(20px,.3em);font-size:clamp(46px,min(12vw,13.5vh),128px)}
.player{display:block;width:100%;aspect-ratio:16/9;border:0;background:#000}
@media (min-width:800px){
  /* side by side the row is ~10.4em wide, so size the title to the width as well as the height */
  /* no upper cap: on large monitors the title and player keep scaling with the viewport */
  .top{flex-direction:row;align-items:flex-start;font-size:max(46px,min(8.4vw,12vh))}
  .top header{flex:none}
  /* title block is 3.65em tall (3 bars of 1.15em + 2 gaps of .1em); 16:9 at that height is 6.49em wide */
  .player{flex:1 1 auto;min-width:0;max-width:6.49em}
}
